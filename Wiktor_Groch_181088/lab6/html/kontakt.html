<section class="form">
    <form id="formularz-kontakt" method="get" action="kontakt.html">

        <label for="email">:Email</label>
        <input type="email" name="email" required id="email">

        <label for="lista">:Produkt</label>
        <select name="produkt" required id="lista">
            <option value=""> -- Wybierz -- </option>
            <option value="klasyczna kaczka">Kaczka</option>
            <option value="kaczka koszykarz">Kaczka z koszykarzem</option>
            <option value="kaczka z Naruto">Kaczka z Naruto</option>
        </select>

        <label for="ilosc">Podaj ilość min 1 max 5</label>
        <input type="number" name="ilosc" min="1" max="5" required step="1" id="ilosc">

        <output id="podglad-ceny" for="lista ilosc" aria-live="polite">Wybierz produkt i poprawną ilość (całkowita 1–5), aby zobaczyć wycenę.</output>

        <label for="wiadomosc">:Wiadomosc min 10 max 500 znakow</label>
        <textarea name="wiadomosc" required minlength="10" maxlength="500" id="wiadomosc"></textarea>
        <p id="blad-wiadomosc" role="alert" hidden></p>

        <button type="submit">Sprawdz zapytanie</button>
    </form>
</section>

<section id="podsumowanie-sekcja" hidden>
    <h2>Podsumowanie zapytania</h2>
    <dl>
        <dt>Produkt:</dt>
        <dd id="podsumowanie-produkt"></dd>

        <dt>Ilość:</dt>
        <dd id="podsumowanie-ilosc"></dd>

        <dt>Wartość:</dt>
        <dd id="podsumowanie-wartosc"></dd>

        <dt>Wiadomość:</dt>
        <dd id="podsumowanie-wiadomosc"></dd>
    </dl>
</section>
